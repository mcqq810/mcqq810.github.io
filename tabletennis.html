<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>乒乓球对打 - 单人触屏版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a202c;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 820px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #F97316;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 96%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
    pointer-events: none;
    color: #fff;
    text-shadow: 1px 1px 3px black;
    font-weight: bold;
  }
  .score-box {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    text-align: center;
    font-size: 14px;
  }
  .score-number { font-size: 28px; font-weight: 900; color: #fbbf24; line-height: 1.2; }
  .control-hint { font-size: 10px; color: #ddd; }
  .set-info {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    text-align: center;
    font-size: 14px;
  }

  /* ===== 按钮区域：独立于游戏容器，放在画布正下方 ===== */
  #touch-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 12px;
    width: 100%;
    max-width: 820px;
  }
  .ctrl-btn {
    width: 80px;
    height: 56px;
    background: #1e3a8a;
    border: 2px solid #3b82f6;
    color: white;
    border-radius: 14px;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #0f1e3d;
    transition: all 0.06s;
    touch-action: manipulation;
    cursor: pointer;
  }
  .ctrl-btn:active {
    background: #2563eb;
    border-color: #60a5fa;
    transform: translateY(4px);
    box-shadow: 0 0 0 #0f1e3d;
  }

  /* 菜单/遮罩通用 */
  .ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    z-index: 20;
    border-radius: 8px;
    padding: 16px;
  }
  .hidden { display: none !important; }
  .settings-panel {
    background: #2d3748;
    padding: 1.5rem;
    border-radius: 1rem;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 0 20px rgba(66,153,225,0.3);
    border: 1px solid #4a5568;
    color: white;
  }
  .form-group { margin-bottom: 1.2rem; }
  .form-label { display: block; margin-bottom: 0.4rem; font-weight: bold; color: #e2e8f0; font-size: 15px; }
  select, input[type="range"] {
    width: 100%; padding: 0.5rem; border-radius: 0.5rem;
    background: #4a5568; border: 1px solid #718096; color: white; outline: none; font-size: 16px;
  }
  .btn {
    background: #3182ce; color: white; border: none;
    padding: 0.8rem 1.5rem; border-radius: 0.5rem;
    font-size: 1.1rem; cursor: pointer; font-weight: bold;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 0.5rem; width: 100%; transition: background 0.2s; touch-action: manipulation;
  }
  .btn:active { background: #2b6cb0; }
  .btn-green { background: #38a169; }
  .btn-green:active { background: #2f855a; }
  .range-value { float: right; color: #63b3ed; }
  .break-controls { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: center; }
  .player-ready-btn {
    width: 130px; height: 90px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    border: 2px solid #4a5568; border-radius: 0.8rem; background: #2d3748;
    cursor: pointer; transition: all 0.2s; touch-action: manipulation;
  }
  .player-ready-btn.active { border-color: #48bb78; background: rgba(72,187,120,0.25); color: #48bb78; }
  .player-ready-btn i { font-size: 1.8rem; margin-bottom: 0.2rem; }
  .text-sm { font-size: 0.85rem; }
  .text-xs { font-size: 0.75rem; }
  .text-center { text-align: center; }
  .text-gray-300 { color: #cbd5e0; }
  .text-gray-400 { color: #a0aec0; }
  .text-yellow-400 { color: #fbbf24; }
  .text-blue-400 { color: #63b3ed; }
  .font-mono { font-family: monospace; }
  .mb-2 { margin-bottom: 0.5rem; }
  .mb-4 { margin-bottom: 1rem; }
  .p-4 { padding: 1rem; }
  .rounded { border-radius: 0.5rem; }
  .bg-gray-700 { background: #2d3748; }
  .border-b { border-bottom: 1px solid #4a5568; }
  .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
  .flex { display: flex; }
  .justify-between { justify-content: space-between; }
</style>
</head>
<body>

<!-- 游戏区域 -->
<div id="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div id="hud" class="hidden">
    <div class="score-box">
      <div>左侧 (P1)</div>
      <div class="score-number" id="score-p1">0</div>
      <div class="control-hint">▲▼ 按钮</div>
    </div>
    <div class="set-info">
      <div>第 <span id="current-set">1</span> 局</div>
      <div class="text-xs">目标: <span id="target-sets">1</span> 局胜</div>
    </div>
    <div class="score-box">
      <div id="p2-name">电脑对手</div>
      <div class="score-number" id="score-p2">0</div>
      <div class="control-hint">AI 自动</div>
    </div>
  </div>

  <div class="ui-layer" id="menu-screen">
    <div class="settings-panel">
      <h1 class="text-center mb-4" style="font-size:1.8rem; color:#63b3ed;">🏓 乒乓球对打</h1>
      <div class="form-group">
        <label class="form-label">对手实力 <span class="range-value" id="ai-level-display">等级 3</span></label>
        <input id="ai-level" max="5" min="1" type="range" value="3"/>
      </div>
      <div class="form-group">
        <label class="form-label">比赛场数</label>
        <select id="match-length">
          <option value="1">一局定胜负</option>
          <option value="3">三局两胜</option>
          <option value="5">五局三胜</option>
          <option value="7">七局四胜</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">球速档次 <span class="range-value" id="speed-level-display">档次 5</span></label>
        <input id="ball-speed" max="10" min="1" type="range" value="5"/>
      </div>
      <button class="btn" onclick="Game.startMatch()">▶ 开始比赛</button>
    </div>
  </div>

  <div class="ui-layer hidden" id="break-screen">
    <h2 style="font-size:2rem; margin-bottom:0.2rem;">局间休息</h2>
    <p style="font-size:1.2rem;">下一局 <span class="text-yellow-400 font-mono" id="break-timer" style="font-size:2rem;">30</span> 秒</p>
    <div class="text-gray-400 text-sm" style="margin:1rem 0;">点击准备可提前开始</div>
    <div class="break-controls">
      <div class="player-ready-btn" id="btn-ready-p1" onclick="Game.toggleReady(1)">
        <i>👤</i><span>准备就绪</span><span class="text-xs">点击准备</span>
      </div>
    </div>
  </div>

  <div class="ui-layer hidden" id="game-over-screen">
    <div class="settings-panel text-center">
      <h2 style="font-size:2rem; color:#fbbf24;">比赛结束</h2>
      <div style="font-size:1.5rem; margin:1rem 0;">获胜者: <span id="winner-name">--</span></div>
      <div class="bg-gray-700 rounded p-4 mb-4">
        <div style="font-weight:bold; border-bottom:1px solid #4a5568; padding-bottom:0.5rem;">比分详情</div>
        <div class="font-mono text-gray-300" id="score-details" style="margin-top:0.5rem;"></div>
      </div>
      <button class="btn btn-green" onclick="Game.resetToMenu()">🔄 重新开始</button>
    </div>
  </div>
</div>

<!-- ✅ 按钮放在 game-container 外面，body 的直接子元素，水平居中 -->
<div id="touch-controls">
  <div class="ctrl-btn" id="btn-p1-up">▲</div>
  <div class="ctrl-btn" id="btn-p1-down">▼</div>
</div>

<script>
  const CONSTANTS = {
    PADDLE_WIDTH: 10, PADDLE_HEIGHT: 80, BALL_RADIUS: 8,
    WIN_SCORE: 11, BREAK_TIME: 30, BASE_BALL_SPEED: 5,
    PADDLE_SPEED: 6, TABLE_MARGIN: 50, TABLE_BORDER: 6
  };

  const Game = {
    canvas: null, ctx: null, animationId: null, lastTime: 0,
    state: 'MENU',
    settings: { aiLevel: 3, matchLength: 1, ballSpeedLevel: 5 },
    matchData: { sets: [], currentSet: 1, p1SetsWon: 0, p2SetsWon: 0 },
    currentScore: { p1: 0, p2: 0 },
    ball: { x: 400, y: 250, vx: 0, vy: 0, speedMultiplier: 1 },
    paddle1: { x: 20, y: 210, width: 10, height: 80 },
    paddle2: { x: 770, y: 210, width: 10, height: 80 },
    keys: { ArrowUp: false, ArrowDown: false },
    touch: { p1Up: false, p1Down: false },
    breakTimer: 30, breakInterval: null,
    readyStatus: { p1: false }, aiOffset: 0,

    init() {
      this.canvas = document.getElementById('gameCanvas');
      this.ctx = this.canvas.getContext('2d');

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); this.keys[e.key] = true; }
      });
      window.addEventListener('keyup', (e) => {
        if (['ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); this.keys[e.key] = false; }
      });

      document.getElementById('ai-level').addEventListener('input', (e) => {
        document.getElementById('ai-level-display').innerText = `等级 ${e.target.value}`;
      });
      document.getElementById('ball-speed').addEventListener('input', (e) => {
        document.getElementById('speed-level-display').innerText = `档次 ${e.target.value}`;
      });

      const bindTouch = (id, prop) => {
        const el = document.getElementById(id);
        if (!el) return;
        const setTrue = (e) => { e.preventDefault(); this.touch[prop] = true; };
        const setFalse = (e) => { e.preventDefault(); this.touch[prop] = false; };
        el.addEventListener('touchstart', setTrue, { passive: false });
        el.addEventListener('touchend', setFalse, { passive: false });
        el.addEventListener('touchcancel', setFalse, { passive: false });
        el.addEventListener('mousedown', setTrue);
        el.addEventListener('mouseup', setFalse);
        el.addEventListener('mouseleave', setFalse);
        el.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
      };
      bindTouch('btn-p1-up', 'p1Up');
      bindTouch('btn-p1-down', 'p1Down');

      this.draw();
    },

    startMatch() {
      this.settings.aiLevel = parseInt(document.getElementById('ai-level').value);
      this.settings.matchLength = parseInt(document.getElementById('match-length').value);
      this.settings.ballSpeedLevel = parseInt(document.getElementById('ball-speed').value);
      document.getElementById('p2-name').innerText = '电脑对手';
      document.getElementById('target-sets').innerText = Math.ceil(this.settings.matchLength / 2);
      this.matchData = { sets: [], currentSet: 1, p1SetsWon: 0, p2SetsWon: 0 };
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      this.startNewSet();
    },

    startNewSet() {
      this.currentScore = { p1: 0, p2: 0 };
      this.updateScoreBoard();
      this.resetBall();
      this.paddle1.y = this.canvas.height / 2 - CONSTANTS.PADDLE_HEIGHT / 2;
      this.paddle2.y = this.canvas.height / 2 - CONSTANTS.PADDLE_HEIGHT / 2;
      this.touch = { p1Up: false, p1Down: false };
      this.state = 'PLAYING';
      document.getElementById('break-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      this.lastTime = performance.now();
      if (this.animationId) cancelAnimationFrame(this.animationId);
      this.loop(this.lastTime);
    },

    resetBall() {
      this.ball.x = this.canvas.width / 2;
      this.ball.y = this.canvas.height / 2;
      const dirX = Math.random() > 0.5 ? 1 : -1;
      const dirY = (Math.random() * 2 - 1) * 0.5;
      const speedMult = 0.5 + (this.settings.ballSpeedLevel - 1) * 0.1;
      const speed = CONSTANTS.BASE_BALL_SPEED * speedMult;
      this.ball.vx = dirX * speed;
      this.ball.vy = dirY * speed;
      this.ball.speedMultiplier = speedMult;
    },

    loop(timestamp) {
      if (this.state !== 'PLAYING') return;
      const deltaTime = (timestamp - this.lastTime) / 1000;
      this.lastTime = timestamp;
      this.update(deltaTime);
      this.draw();
      this.animationId = requestAnimationFrame((t) => this.loop(t));
    },

    update(dt) {
      if (this.keys.ArrowUp || this.touch.p1Up) this.paddle1.y -= CONSTANTS.PADDLE_SPEED;
      if (this.keys.ArrowDown || this.touch.p1Down) this.paddle1.y += CONSTANTS.PADDLE_SPEED;
      this.paddle1.y = Math.max(0, Math.min(this.canvas.height - this.paddle1.height, this.paddle1.y));

      this.updateAI(dt);
      this.paddle2.y = Math.max(0, Math.min(this.canvas.height - this.paddle2.height, this.paddle2.y));

      this.ball.x += this.ball.vx;
      this.ball.y += this.ball.vy;

      const tableTop = CONSTANTS.TABLE_MARGIN;
      const tableBottom = this.canvas.height - CONSTANTS.TABLE_MARGIN;

      if (this.ball.y - CONSTANTS.BALL_RADIUS < tableTop) {
        this.ball.y = tableTop + CONSTANTS.BALL_RADIUS;
        this.ball.vy = -this.ball.vy;
      } else if (this.ball.y + CONSTANTS.BALL_RADIUS > tableBottom) {
        this.ball.y = tableBottom - CONSTANTS.BALL_RADIUS;
        this.ball.vy = -this.ball.vy;
      }

      if (this.ball.vx < 0 && this.ball.x - CONSTANTS.BALL_RADIUS < this.paddle1.x + this.paddle1.width &&
          this.ball.x + CONSTANTS.BALL_RADIUS > this.paddle1.x &&
          this.ball.y > this.paddle1.y && this.ball.y < this.paddle1.y + this.paddle1.height) {
        this.ball.vx = -this.ball.vx * 1.05;
        this.ball.vy *= 1.05;
        const hitPoint = this.ball.y - (this.paddle1.y + this.paddle1.height / 2);
        this.ball.vy += hitPoint * 0.1;
        this.ball.x = this.paddle1.x + this.paddle1.width + CONSTANTS.BALL_RADIUS + 1;
      }

      if (this.ball.vx > 0 && this.ball.x + CONSTANTS.BALL_RADIUS > this.paddle2.x &&
          this.ball.x - CONSTANTS.BALL_RADIUS < this.paddle2.x + this.paddle2.width &&
          this.ball.y > this.paddle2.y && this.ball.y < this.paddle2.y + this.paddle2.height) {
        this.ball.vx = -this.ball.vx * 1.05;
        this.ball.vy *= 1.05;
        const hitPoint = this.ball.y - (this.paddle2.y + this.paddle2.height / 2);
        this.ball.vy += hitPoint * 0.1;
        this.ball.x = this.paddle2.x - CONSTANTS.BALL_RADIUS - 1;
      }

      if (this.ball.x < 0) this.scorePoint(2);
      else if (this.ball.x > this.canvas.width) this.scorePoint(1);
    },

    updateAI(dt) {
      const level = this.settings.aiLevel;
      let targetY = this.canvas.height / 2 - this.paddle2.height / 2;
      if (this.ball.vx > 0) targetY = this.ball.y - this.paddle2.height / 2;
      const errorMargin = (6 - level) * 8;
      if (!this.aiOffset || Math.random() < 0.02) this.aiOffset = (Math.random() - 0.5) * errorMargin * 2;
      targetY += this.aiOffset;
      targetY = Math.max(0, Math.min(this.canvas.height - this.paddle2.height, targetY));
      const aiSpeed = 2.5 + level * 1.1;
      if (this.paddle2.y < targetY) this.paddle2.y += Math.min(aiSpeed, targetY - this.paddle2.y);
      else if (this.paddle2.y > targetY) this.paddle2.y -= Math.min(aiSpeed, this.paddle2.y - targetY);
    },

    scorePoint(player) {
      if (player === 1) this.currentScore.p1++; else this.currentScore.p2++;
      this.updateScoreBoard();
      this.checkSetWin();
    },

    updateScoreBoard() {
      document.getElementById('score-p1').innerText = this.currentScore.p1;
      document.getElementById('score-p2').innerText = this.currentScore.p2;
      document.getElementById('current-set').innerText = this.matchData.currentSet;
    },

    checkSetWin() {
      const p1 = this.currentScore.p1, p2 = this.currentScore.p2, winScore = CONSTANTS.WIN_SCORE;
      let winner = 0;
      if (p1 >= winScore && p1 - p2 >= 2) winner = 1;
      else if (p2 >= winScore && p2 - p1 >= 2) winner = 2;
      if (winner !== 0) this.endSet(winner);
      else this.resetBall();
    },

    endSet(winner) {
      this.matchData.sets.push({ p1: this.currentScore.p1, p2: this.currentScore.p2 });
      if (winner === 1) this.matchData.p1SetsWon++; else this.matchData.p2SetsWon++;
      const setsToWin = Math.ceil(this.settings.matchLength / 2);
      if (this.matchData.p1SetsWon === setsToWin || this.matchData.p2SetsWon === setsToWin) this.endMatch(winner);
      else this.startBreak();
    },

    startBreak() {
      this.state = 'BREAK';
      this.matchData.currentSet++;
      this.breakTimer = CONSTANTS.BREAK_TIME;
      this.readyStatus = { p1: false };
      document.getElementById('break-screen').classList.remove('hidden');
      document.getElementById('break-timer').innerText = this.breakTimer;
      this.updateReadyButtons();
      if (this.breakInterval) clearInterval(this.breakInterval);
      this.breakInterval = setInterval(() => {
        this.breakTimer--;
        document.getElementById('break-timer').innerText = this.breakTimer;
        if (this.breakTimer <= 0) { clearInterval(this.breakInterval); this.startNewSet(); }
      }, 1000);
    },

    toggleReady(player) {
      if (this.state !== 'BREAK') return;
      this.readyStatus.p1 = !this.readyStatus.p1;
      this.updateReadyButtons();
      if (this.readyStatus.p1) { clearInterval(this.breakInterval); setTimeout(() => this.startNewSet(), 300); }
    },

    updateReadyButtons() {
      const btn1 = document.getElementById('btn-ready-p1');
      if (this.readyStatus.p1) btn1.classList.add('active'); else btn1.classList.remove('active');
    },

    endMatch(winner) {
      this.state = 'GAME_OVER';
      clearInterval(this.breakInterval);
      const winnerName = winner === 1 ? "左侧选手 (你)" : "电脑对手";
      document.getElementById('winner-name').innerText = winnerName;
      const detailsHtml = this.matchData.sets.map((set, index) => {
        const p1Win = set.p1 > set.p2;
        const p1Class = p1Win ? 'text-green-400 font-bold' : 'text-gray-400';
        const p2Class = !p1Win ? 'text-green-400 font-bold' : 'text-gray-400';
        return `<div class="flex justify-between border-b border-gray-600 py-1">
          <span>第 ${index + 1} 局</span>
          <span><span class="${p1Class}">${set.p1}</span> - <span class="${p2Class}">${set.p2}</span></span>
        </div>`;
      }).join('');
      document.getElementById('score-details').innerHTML = detailsHtml;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('break-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.remove('hidden');
    },

    resetToMenu() {
      document.getElementById('game-over-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
      this.state = 'MENU';
      this.draw();
    },

    draw() {
      const w = this.canvas.width, h = this.canvas.height, margin = CONSTANTS.TABLE_MARGIN;
      this.ctx.clearRect(0, 0, w, h);
      this.ctx.fillStyle = '#F97316';
      this.ctx.fillRect(0, 0, w, h);
      this.ctx.fillStyle = '#1E40AF';
      this.ctx.fillRect(margin, margin, w - margin * 2, h - margin * 2);
      this.ctx.strokeStyle = '#3B82F6';
      this.ctx.lineWidth = CONSTANTS.TABLE_BORDER;
      this.ctx.strokeRect(margin, margin, w - margin * 2, h - margin * 2);
      this.ctx.beginPath();
      this.ctx.moveTo(w / 2, margin);
      this.ctx.lineTo(w / 2, h - margin);
      this.ctx.strokeStyle = '#fff';
      this.ctx.lineWidth = 2;
      this.ctx.setLineDash([10, 10]);
      this.ctx.stroke();
      this.ctx.setLineDash([]);
      this.ctx.fillStyle = '#fff';
      this.ctx.fillRect(w / 2 - 1, margin, 2, h - margin * 2);
      this.ctx.fillStyle = '#fff';
      this.ctx.fillRect(this.paddle1.x, this.paddle1.y, this.paddle1.width, this.paddle1.height);
      this.ctx.fillStyle = '#000';
      this.ctx.fillRect(this.paddle2.x, this.paddle2.y, this.paddle2.width, this.paddle2.height);
      this.ctx.beginPath();
      this.ctx.arc(this.ball.x, this.ball.y, CONSTANTS.BALL_RADIUS, 0, Math.PI * 2);
      this.ctx.fillStyle = '#fff';
      this.ctx.fill();
      this.ctx.strokeStyle = '#000';
      this.ctx.lineWidth = 1;
      this.ctx.stroke();
    }
  };

  window.onload = () => Game.init();
</script>
</body>
</html>
