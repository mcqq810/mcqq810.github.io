<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("keydown",function(e){
  if(e.key==="F12"||e.keyCode===123||(e.ctrlKey&&(e.key==="u"||e.keyCode===85))||(e.ctrlKey&&e.shiftKey&&(e.key==="I"||e.keyCode===73))||(e.ctrlKey&&e.shiftKey&&(e.key==="J"||e.keyCode===74))||(e.ctrlKey&&(e.key==="s"||e.keyCode===83))){e.preventDefault()}
});
document.addEventListener("selectstart",function(e){
  if(e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA")e.preventDefault()
});
document.addEventListener("dragstart",function(e){e.preventDefault()});
document.addEventListener("copy",function(e){
  if(e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA")e.preventDefault()
});
</script>

<!-- data-protection-injected -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 自定义地图双人对战版</title>
    <style>
        :root {
            --bg-color: #B6C79C;
            --text-color: #3B3B3B;
            --p1-color: #2E7D32;
            --p2-color: #1565C0;
            --trap-color: #D32F2F;
            --obs-color: #8B4513;
            --cursor-color: rgba(255, 0, 0, 0.6);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 28px;
            color: var(--text-color);
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .stats-board {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            color: var(--text-color);
            font-size: 14px;
        }

        .p1-stat { color: var(--p1-color); }
        .p2-stat { color: var(--p2-color); }

        #gameCanvas {
            width: 500px;
            height: 500px;
            border: 3px solid #555;
            background-color: #C5D5B0;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            image-rendering: pixelated;
            cursor: crosshair;
        }

        .controls-panel {
            width: 240px;
            background: rgba(255,255,255,0.6);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }

        input[type="number"], select {
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-family: inherit;
        }

        input[type="range"] {
            width: 100%;
        }

        button {
            padding: 10px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background-color: #333;
        }

        button.primary {
            background-color: var(--p1-color);
        }
        button.primary:hover {
            background-color: #1b5e20;
        }
        
        button.edit-mode {
            background-color: #d32f2f;
        }
        button.edit-mode:hover {
            background-color: #b71c1c;
        }

        .legend {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .box { width: 12px; height: 12px; display: inline-block; border: 1px solid #000; }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal h2 { margin-top: 0; color: var(--text-color); }
        .result-details {
            text-align: left;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-line;
        }
        .winner-text {
            font-size: 20px;
            font-weight: bold;
            color: #d32f2f;
            margin: 10px 0;
        }
        
        .edit-hint {
            font-size: 12px;
            color: #d32f2f;
            background: rgba(255,255,255,0.8);
            padding: 5px;
            border-radius: 4px;
            margin-top: 5px;
            display: none;
            border: 1px solid #d32f2f;
        }
        .edit-hint.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="game-area">
        <div class="title">贪吃蛇 - 自定义地图版</div>
        <div class="stats-board" id="statsBoard">
            <span class="p1-stat">P1 (WASD): <span id="p1Score">0</span>分 | 长:<span id="p1Len">3</span></span>
            <span style="color:#999">|</span>
            <span class="p2-stat">P2 (箭头): <span id="p2Score">0</span>分 | 长:<span id="p2Len">3</span></span>
        </div>
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div style="margin-top:10px; font-size:12px; color:#555;" id="statusText">按空格键开始/暂停</div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label>游戏模式</label>
            <select id="gameMode">
                <option value="single">单人经典</option>
                <option value="duo" selected>双人对战</option>
            </select>
        </div>

        <div class="control-group">
            <label>障碍物设置</label>
            <select id="obsModeSelect">
                <option value="random">随机生成</option>
                <option value="custom">🛠️ 自定义绘制</option>
            </select>
            
            <div id="randomControls">
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <input type="number" id="obsCountInput" placeholder="数量" min="0" max="100" style="flex:1;">
                    <button onclick="toggleObsRandom()" id="btnObsRandom" style="margin:0; padding:5px;">随机</button>
                </div>
            </div>

            <div id="customControls" style="display:none;">
                <button class="edit-mode" id="btnStartEdit" onclick="toggleEditMode()">进入编辑模式</button>
                <div class="edit-hint" id="editHint">
                    <b>编辑模式:</b><br>
                    WASD/方向键: 移动光标<br>
                    空格: 放置/移除障碍<br>
                    点击"完成"开始游戏
                </div>
                <button id="btnFinishEdit" onclick="finishEditing()" style="display:none; background-color: #2E7D32;">✅ 完成设置并开始</button>
            </div>
        </div>

        <div class="control-group">
            <label>移动速度: <span id="speedVal">5</span></label>
            <input type="range" id="speedRange" min="1" max="10" value="5">
        </div>

        <button class="primary" id="btnStartGame" onclick="startGameFromMenu()">开始新游戏</button>

        <div class="legend">
            <div class="legend-item"><span class="box" style="background:var(--p1-color)"></span> P1 (WASD)</div>
            <div class="legend-item"><span class="box" style="background:var(--p2-color)"></span> P2 (方向键)</div>
            <div class="legend-item"><span class="box" style="background:var(--trap-color)"></span> 陷阱 (-1长度)</div>
            <div class="legend-item"><span class="box" style="background:#00AA00"></span> 苹果 (+1长度)</div>
            <div class="legend-item"><span class="box" style="background:var(--obs-color)"></span> 障碍物 (即死)</div>
        </div>
    </div>
</div>

<!-- 游戏结束/结算模态框 -->
<div class="modal-overlay" id="gameOverModal">
    <div class="modal">
        <h2 id="modalTitle">游戏结束</h2>
        <div class="winner-text" id="winnerText"></div>
        <div class="result-details" id="resultDetails"></div>
        <button class="primary" onclick="closeModalAndRestart()">再来一局</button>
        <button onclick="closeModal()">返回菜单</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // 配置
    const gridSize = 20; 
    const gridWidth = canvas.width / gridSize;
    const gridHeight = canvas.height / gridSize;
    
    // 状态变量
    let gameMode = 'duo'; 
    let obsMode = 'random'; // 'random' or 'custom'
    let obstacleCount = -1; 
    let speedLevel = 5;
    let baseDelay = 150;
    
    let snake1 = []; 
    let snake2 = []; 
    let foods = [];
    let traps = [];
    let obstacles = [];
    
    // 编辑模式变量
    let isEditMode = false;
    let editCursor = { x: 10, y: 10 };
    
    let dir1 = {x:1, y:0};
    let nextDir1 = {x:1, y:0};
    let dir2 = {x:-1, y:0};
    let nextDir2 = {x:-1, y:0};
    
    let score1 = 0;
    let score2 = 0;
    
    let gameRunning = false;
    let gamePaused = false;
    let lastTime = 0;
    let animationId = null;

    // DOM 元素
    const els = {
        p1Score: document.getElementById('p1Score'),
        p1Len: document.getElementById('p1Len'),
        p2Score: document.getElementById('p2Score'),
        p2Len: document.getElementById('p2Len'),
        modeSelect: document.getElementById('gameMode'),
        obsModeSelect: document.getElementById('obsModeSelect'),
        randomControls: document.getElementById('randomControls'),
        customControls: document.getElementById('customControls'),
        obsInput: document.getElementById('obsCountInput'),
        obsBtn: document.getElementById('btnObsRandom'),
        obsDisplay: document.getElementById('obsValDisplay'), // 复用或新建
        speedRange: document.getElementById('speedRange'),
        speedVal: document.getElementById('speedVal'),
        btnStartEdit: document.getElementById('btnStartEdit'),
        btnFinishEdit: document.getElementById('btnFinishEdit'),
        editHint: document.getElementById('editHint'),
        btnStartGame: document.getElementById('btnStartGame'),
        statusText: document.getElementById('statusText'),
        modal: document.getElementById('gameOverModal'),
        modalTitle: document.getElementById('modalTitle'),
        winnerText: document.getElementById('winnerText'),
        resultDetails: document.getElementById('resultDetails')
    };

    // 初始化监听
    els.modeSelect.addEventListener('change', (e) => {
        gameMode = e.target.value;
        updateUI();
    });

    els.obsModeSelect.addEventListener('change', (e) => {
        obsMode = e.target.value;
        if (obsMode === 'random') {
            els.randomControls.style.display = 'block';
            els.customControls.style.display = 'none';
            if(isEditMode) toggleEditMode(); // 如果正在编辑，先退出
        } else {
            els.randomControls.style.display = 'none';
            els.customControls.style.display = 'block';
        }
        initGame(false); // 重置但不开始
    });

    els.speedRange.addEventListener('input', (e) => {
        speedLevel = parseInt(e.target.value);
        els.speedVal.textContent = speedLevel;
        baseDelay = 200 - (speedLevel * 16); 
    });

    function toggleObsRandom() {
        if (obstacleCount === -1) {
            obstacleCount = 0;
            els.obsInput.value = 0;
            els.obsInput.disabled = false;
            els.obsBtn.textContent = "固定";
        } else {
            obstacleCount = -1;
            els.obsInput.value = '';
            els.obsInput.disabled = true;
            els.obsBtn.textContent = "随机";
        }
    }
    
    // 初始化障碍数输入框状态
    toggleObsRandom(); 
    els.obsInput.addEventListener('input', (e) => {
        if(obstacleCount !== -1) {
            obstacleCount = parseInt(e.target.value) || 0;
        }
    });

    function updateUI() {
        const isDuo = gameMode === 'duo';
        document.querySelector('.p2-stat').parentElement.style.visibility = isDuo ? 'visible' : 'hidden';
        
        if (isEditMode) {
            els.statusText.textContent = "🛠️ 编辑模式中：移动光标放置障碍物";
            els.statusText.style.color = "#d32f2f";
            els.statusText.style.fontWeight = "bold";
        } else if (!gameRunning) {
            els.statusText.textContent = "按空格键开始游戏";
            els.statusText.style.color = "#555";
            els.statusText.style.fontWeight = "normal";
        }
    }

    function toggleEditMode() {
        if (isEditMode) {
            // 退出编辑模式（取消）
            isEditMode = false;
            els.btnStartEdit.textContent = "进入编辑模式";
            els.btnStartEdit.classList.remove('primary');
            els.btnStartEdit.classList.add('edit-mode');
            els.btnFinishEdit.style.display = 'none';
            els.editHint.classList.remove('active');
            // 清除临时障碍物？不，我们直接操作全局 obstacles 数组，所以不需要清除，除非用户想重置
            // 这里简单处理：退出编辑只是停止光标移动，保留已画的
        } else {
            // 进入编辑模式
            isEditMode = true;
            // 如果是从随机切换过来的，先清空障碍物
            if (obsMode === 'custom' && obstacles.length > 0 && !confirm("是否清空现有障碍物重新绘制？\n点击【取消】保留现有并继续添加。")) {
                 obstacles = [];
            }
            
            els.btnStartEdit.textContent = "取消编辑";
            els.btnStartEdit.classList.remove('edit-mode');
            els.btnStartEdit.classList.add('primary');
            els.btnFinishEdit.style.display = 'block';
            els.editHint.classList.add('active');
            
            // 初始化光标在中心
            editCursor = { x: Math.floor(gridWidth/2), y: Math.floor(gridHeight/2) };
        }
        updateUI();
        draw();
    }

    function finishEditing() {
        if (!isEditMode) return;
        toggleEditMode(); // 退出编辑状态
        startGameFromMenu(); // 直接开始
    }

    function isSafe(x, y, excludeFoods = [], excludeTraps = []) {
        if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return false;
        // 编辑模式下不需要检查蛇，因为蛇还没生成
        if (!isEditMode) {
            for (let s of snake1) if (s.x === x && s.y === y) return false;
            if (gameMode === 'duo') {
                for (let s of snake2) if (s.x === x && s.y === y) return false;
            }
        }
        for (let o of obstacles) if (o.x === x && o.y === y) return false;
        for (let f of excludeFoods) if (f.x === x && f.y === y) return false;
        for (let f of foods) if (f.x === x && f.y === y) return false;
        for (let t of excludeTraps) if (t.x === x && t.y === y) return false;
        for (let t of traps) if (t.x === x && t.y === y) return false;
        return true;
    }

    function getRandomPos(excludeFoods = [], excludeTraps = []) {
        let pos;
        let attempts = 0;
        do {
            pos = {
                x: Math.floor(Math.random() * gridWidth),
                y: Math.floor(Math.random() * gridHeight)
            };
            attempts++;
            if (attempts > 500) return null; 
        } while (!isSafe(pos.x, pos.y, excludeFoods, excludeTraps));
        return pos;
    }

    function initGame(resetObstacles = true) {
        // 如果不是重置障碍物（比如只是重新开始游戏但保留地图），则跳过障碍物生成
        if (resetObstacles) {
            obstacles = [];
            if (obsMode === 'random') {
                let count = obstacleCount;
                if (count === -1) {
                    count = gameMode === 'single' 
                        ? Math.floor(Math.random() * 10) + 10 
                        : Math.floor(Math.random() * 15) + 15;
                }
                for(let i=0; i<count; i++) {
                    let pos = getRandomPos();
                    if(pos) obstacles.push(pos);
                }
            }
            // 如果是 custom 模式，obstacles 数组应该已经由用户填充好了，这里不做操作
        }

        // 重置蛇
        const startY = Math.floor(gridHeight / 2);
        snake1 = [
            {x: 2, y: startY}, 
            {x: 1, y: startY}, 
            {x: 0, y: startY}
        ];
        dir1 = {x: 1, y: 0};
        nextDir1 = {x: 1, y: 0};
        score1 = 0;

        if (gameMode === 'duo') {
            snake2 = [
                {x: gridWidth - 3, y: startY}, 
                {x: gridWidth - 2, y: startY}, 
                {x: gridWidth - 1, y: startY}
            ];
            dir2 = {x: -1, y: 0};
            nextDir2 = {x: -1, y: 0};
            score2 = 0;
        } else {
            snake2 = [];
            score2 = 0;
        }

        refreshItems(true);
        updateStats();
        draw();
    }

    function refreshItems(fullRefresh = false) {
        const itemCount = gameMode === 'duo' ? 2 : 1;
        
        if (fullRefresh || foods.length < itemCount) {
            foods = [];
            for(let i=0; i<itemCount; i++) {
                let pos = getRandomPos([], traps);
                if(pos) foods.push(pos);
            }
        }

        if (fullRefresh || traps.length < itemCount) {
            traps = [];
            for(let i=0; i<itemCount; i++) {
                let pos = getRandomPos(foods, []);
                if(pos) traps.push(pos);
            }
        }
    }

    function updateStats() {
        els.p1Score.textContent = score1;
        els.p1Len.textContent = snake1.length;
        if (gameMode === 'duo') {
            els.p2Score.textContent = score2;
            els.p2Len.textContent = snake2.length;
        }
    }

    function draw() {
        ctx.fillStyle = '#C5D5B0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 网格
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= canvas.width; x += gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y <= canvas.height; y += gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();

        // 障碍物
        ctx.fillStyle = '#8B4513';
        ctx.strokeStyle = '#5c2e0b';
        for (let o of obstacles) {
            ctx.fillRect(o.x * gridSize, o.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(o.x * gridSize, o.y * gridSize, gridSize, gridSize);
            // X 标记
            ctx.beginPath();
            ctx.strokeStyle = '#A0522D';
            ctx.moveTo(o.x * gridSize + 4, o.y * gridSize + 4);
            ctx.lineTo(o.x * gridSize + gridSize - 4, o.y * gridSize + gridSize - 4);
            ctx.moveTo(o.x * gridSize + gridSize - 4, o.y * gridSize + 4);
            ctx.lineTo(o.x * gridSize + 4, o.y * gridSize + gridSize - 4);
            ctx.stroke();
        }

        // 食物
        ctx.fillStyle = '#00AA00';
        for (let f of foods) {
            ctx.fillRect(f.x * gridSize, f.y * gridSize, gridSize, gridSize);
            ctx.strokeStyle = '#006400';
            ctx.strokeRect(f.x * gridSize, f.y * gridSize, gridSize, gridSize);
            ctx.fillStyle = '#FFF';
            ctx.fillRect(f.x * gridSize + 8, f.y * gridSize + 4, 4, 12);
            ctx.fillRect(f.x * gridSize + 4, f.y * gridSize + 8, 12, 4);
        }

        // 陷阱
        ctx.fillStyle = '#D32F2F';
        for (let t of traps) {
            ctx.fillRect(t.x * gridSize, t.y * gridSize, gridSize, gridSize);
            ctx.strokeStyle = '#8B0000';
            ctx.strokeRect(t.x * gridSize, t.y * gridSize, gridSize, gridSize);
            ctx.fillStyle = '#FFF';
            ctx.fillRect(t.x * gridSize + 4, t.y * gridSize + 8, 12, 4);
        }

        // 蛇
        if (!isEditMode) {
            drawSnake(snake1, '#2E7D32', '#4CAF50');
            if (gameMode === 'duo') {
                drawSnake(snake2, '#1565C0', '#42A5F5');
            }
        }

        // 编辑模式光标
        if (isEditMode) {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(editCursor.x * gridSize, editCursor.y * gridSize, gridSize, gridSize);
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            ctx.strokeRect(editCursor.x * gridSize, editCursor.y * gridSize, gridSize, gridSize);
            
            // 十字准星
            ctx.beginPath();
            ctx.moveTo(editCursor.x * gridSize, editCursor.y * gridSize + gridSize/2);
            ctx.lineTo(editCursor.x * gridSize + gridSize, editCursor.y * gridSize + gridSize/2);
            ctx.moveTo(editCursor.x * gridSize + gridSize/2, editCursor.y * gridSize);
            ctx.lineTo(editCursor.x * gridSize + gridSize/2, editCursor.y * gridSize + gridSize);
            ctx.stroke();
        }

        // 边框
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        if (!gameRunning && !isEditMode) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(gamePaused ? "已暂停" : "按空格开始", canvas.width/2, canvas.height/2);
            
            ctx.font = '16px Arial';
            if(gameMode === 'duo') {
                ctx.fillText("P1: WASD  |  P2: 方向键", canvas.width/2, canvas.height/2 + 30);
            } else {
                ctx.fillText("P1: 方向键/WASD", canvas.width/2, canvas.height/2 + 30);
            }
        }
    }

    function drawSnake(snake, colorHead, colorBody) {
        snake.forEach((seg, index) => {
            ctx.fillStyle = index === 0 ? colorHead : colorBody;
            ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize, gridSize);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(seg.x * gridSize, seg.y * gridSize, gridSize, gridSize);
            
            if (index === 0) {
                ctx.fillStyle = '#FFF';
                ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 4, 4, 4);
                ctx.fillRect(seg.x * gridSize + 12, seg.y * gridSize + 4, 4, 4);
            }
        });
    }

    function update() {
        if (!gameRunning || gamePaused) return;

        dir1 = nextDir1;
        if (gameMode === 'duo') dir2 = nextDir2;

        const head1 = { x: snake1[0].x + dir1.x, y: snake1[0].y + dir1.y };
        let head2 = null;
        if (gameMode === 'duo') {
            head2 = { x: snake2[0].x + dir2.x, y: snake2[0].y + dir2.y };
        }

        const wrap = (h) => {
            if (h.x < 0) h.x = gridWidth - 1;
            else if (h.x >= gridWidth) h.x = 0;
            if (h.y < 0) h.y = gridHeight - 1;
            else if (h.y >= gridHeight) h.y = 0;
        };
        wrap(head1);
        if (head2) wrap(head2);

        let p1Dead = false;
        let p2Dead = false;
        let p1Reason = "";
        let p2Reason = "";

        if (checkCollision(head1, obstacles)) { p1Dead = true; p1Reason = "撞到障碍物"; }
        if (head2 && checkCollision(head2, obstacles)) { p2Dead = true; p2Reason = "撞到障碍物"; }

        if (!p1Dead && checkCollision(head1, snake1)) { p1Dead = true; p1Reason = "撞到自己"; }
        if (head2 && !p2Dead && checkCollision(head2, snake2)) { p2Dead = true; p2Reason = "撞到自己"; }

        if (gameMode === 'duo') {
            if (!p1Dead && checkCollision(head1, snake2)) { p1Dead = true; p1Reason = "撞到对手"; }
            if (!p2Dead && checkCollision(head2, snake1)) { p2Dead = true; p2Reason = "撞到对手"; }
            
            if (!p1Dead && !p2Dead && head1.x === head2.x && head1.y === head2.y) {
                p1Dead = true; p1Reason = "正面相撞";
                p2Dead = true; p2Reason = "正面相撞";
            }
        }

        snake1.unshift(head1);
        if (head2) snake2.unshift(head2);

        let p1AteFood = false;
        let p1AteTrap = false;
        let p2AteFood = false;
        let p2AteTrap = false;

        const f1Idx = foods.findIndex(f => f.x === head1.x && f.y === head1.y);
        const t1Idx = traps.findIndex(t => t.x === head1.x && t.y === head1.y);
        
        if (f1Idx !== -1) { p1AteFood = true; score1 += 10; }
        else if (t1Idx !== -1) { p1AteTrap = true; }

        if (gameMode === 'duo') {
            const f2Idx = foods.findIndex(f => f.x === head2.x && f.y === head2.y);
            const t2Idx = traps.findIndex(t => t.x === head2.x && t.y === head2.y);
            
            if (f2Idx !== -1) { p2AteFood = true; score2 += 10; }
            else if (t2Idx !== -1) { p2AteTrap = true; }
        }

        if (p1AteFood) {
            // 保持长度
        } else if (p1AteTrap) {
            snake1.pop(); 
            snake1.pop(); 
            if (snake1.length <= 0) { p1Dead = true; p1Reason = "长度归零"; snake1 = []; }
        } else {
            snake1.pop();
        }

        if (gameMode === 'duo') {
            if (p2AteFood) {
                // 保持
            } else if (p2AteTrap) {
                snake2.pop();
                snake2.pop();
                if (snake2.length <= 0) { p2Dead = true; p2Reason = "长度归零"; snake2 = []; }
            } else {
                snake2.pop();
            }
        }

        if (p1AteFood || p1AteTrap || p2AteFood || p2AteTrap) {
            refreshItems(true);
        }

        if (p1Dead || p2Dead) {
            endGame(p1Dead, p2Dead, p1Reason, p2Reason);
            return;
        }

        updateStats();
    }

    function checkCollision(head, array) {
        return array.some(seg => seg.x === head.x && seg.y === head.y);
    }

    function gameLoop(timestamp) {
        if (!gameRunning) return;
        const delay = baseDelay;
        if (timestamp - lastTime > delay) {
            update();
            draw();
            lastTime = timestamp;
        }
        if (gameRunning) {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    function startGameFromMenu() {
        closeModal();
        if (isEditMode) {
            toggleEditMode(); // 确保退出编辑模式
        }
        initGame(obsMode === 'random'); // 如果是随机模式，重新生成障碍；如果是自定义，保留
        gameRunning = true;
        gamePaused = false;
        lastTime = performance.now();
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop(lastTime);
    }

    function endGame(p1Dead, p2Dead, r1, r2) {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        draw(); 

        let title = "游戏结束";
        let winner = "";
        let details = "";

        if (gameMode === 'single') {
            title = "单人模式结束";
            winner = p1Dead ? `失败原因：${r1}` : "未知错误";
            details = `最终得分：${score1}\n最终长度：${snake1.length}\n历史最高分：${Math.max(score1, localStorage.getItem('snake_highscore')||0)}`;
            if (score1 > (localStorage.getItem('snake_highscore')||0)) {
                localStorage.setItem('snake_highscore', score1);
                details += "\n(新纪录!)";
            }
        } else {
            if (p1Dead && p2Dead) {
                winner = "平局!";
                details = `P1: ${r1}\nP2: ${r2}\n\nP1 得分: ${score1}\nP2 得分: ${score2}`;
            } else if (p1Dead) {
                winner = "P2 (蓝蛇) 获胜!";
                details = `P1 失败原因：${r1}\n\nP1 得分: ${score1}\nP2 得分: ${score2}`;
            } else if (p2Dead) {
                winner = "P1 (绿蛇) 获胜!";
                details = `P2 失败原因：${r2}\n\nP1 得分: ${score1}\nP2 得分: ${score2}`;
            }
        }

        els.modalTitle.textContent = title;
        els.winnerText.textContent = winner;
        els.resultDetails.textContent = details;
        els.modal.style.display = 'flex';
    }

    function closeModal() {
        els.modal.style.display = 'none';
        if (!gameRunning && !isEditMode) {
            // 如果不在编辑模式且没运行，重绘初始状态
            // 注意：这里不调用 initGame 以免清除自定义地图，只重绘
            draw();
        }
    }

    function closeModalAndRestart() {
        startGameFromMenu();
    }

    // 键盘控制增强
    document.addEventListener('keydown', (e) => {
        // 防止默认滚动
        if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
            e.preventDefault();
        }

        // --- 编辑模式控制 ---
        if (isEditMode) {
            let moved = false;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { 
                if(editCursor.y > 0) { editCursor.y--; moved = true; } 
            }
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { 
                if(editCursor.y < gridHeight - 1) { editCursor.y++; moved = true; } 
            }
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { 
                if(editCursor.x > 0) { editCursor.x--; moved = true; } 
            }
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { 
                if(editCursor.x < gridWidth - 1) { editCursor.x++; moved = true; } 
            }
            
            if (moved) {
                draw();
                return;
            }

            if (e.key === ' ') {
                // 放置或移除障碍
                const existingIdx = obstacles.findIndex(o => o.x === editCursor.x && o.y === editCursor.y);
                if (existingIdx !== -1) {
                    obstacles.splice(existingIdx, 1); // 移除
                } else {
                    // 检查是否在蛇的初始位置（虽然蛇还没生成，但为了逻辑严谨，可以检查坐标范围）
                    // 这里简单直接添加
                    obstacles.push({x: editCursor.x, y: editCursor.y});
                }
                draw();
                return;
            }
            
            if (e.key === 'Backspace' || e.key === 'Delete') {
                const existingIdx = obstacles.findIndex(o => o.x === editCursor.x && o.y === editCursor.y);
                if (existingIdx !== -1) {
                    obstacles.splice(existingIdx, 1);
                    draw();
                }
                return;
            }
            
            // 编辑模式下屏蔽其他游戏控制
            return;
        }

        // --- 游戏控制 ---
        if (e.key === ' ') {
            if (!gameRunning && els.modal.style.display !== 'flex') {
                // 如果不在编辑模式，空格开始游戏
                if (obsMode === 'custom' && obstacles.length === 0) {
                    if(confirm("当前没有放置任何障碍物，确定直接开始吗？")) {
                        startGameFromMenu();
                    }
                } else {
                    startGameFromMenu();
                }
            } else if (gameRunning) {
                gamePaused = !gamePaused;
                draw();
            }
            return;
        }

        if (e.key === 'Escape') {
            if (gameRunning) {
                gamePaused = true;
                draw();
            }
            return;
        }

        if (!gameRunning || gamePaused) return;

        const isDuo = gameMode === 'duo';

        // P1 (WASD)
        if (e.key === 'w' || e.key === 'W') { if (dir1.y === 0) nextDir1 = {x:0, y:-1}; }
        if (e.key === 's' || e.key === 'S') { if (dir1.y === 0) nextDir1 = {x:0, y:1}; }
        if (e.key === 'a' || e.key === 'A') { if (dir1.x === 0) nextDir1 = {x:-1, y:0}; }
        if (e.key === 'd' || e.key === 'D') { if (dir1.x === 0) nextDir1 = {x:1, y:0}; }

        if (!isDuo) {
            // 单人模式：箭头控制 P1
            if (e.key === 'ArrowUp') { if (dir1.y === 0) nextDir1 = {x:0, y:-1}; }
            if (e.key === 'ArrowDown') { if (dir1.y === 0) nextDir1 = {x:0, y:1}; }
            if (e.key === 'ArrowLeft') { if (dir1.x === 0) nextDir1 = {x:-1, y:0}; }
            if (e.key === 'ArrowRight') { if (dir1.x === 0) nextDir1 = {x:1, y:0}; }
        } else {
            // 双人模式：箭头控制 P2
            if (e.key === 'ArrowUp') { if (dir2.y === 0) nextDir2 = {x:0, y:-1}; }
            if (e.key === 'ArrowDown') { if (dir2.y === 0) nextDir2 = {x:0, y:1}; }
            if (e.key === 'ArrowLeft') { if (dir2.x === 0) nextDir2 = {x:-1, y:0}; }
            if (e.key === 'ArrowRight') { if (dir2.x === 0) nextDir2 = {x:1, y:0}; }
        }
    });

    // 启动
    initGame(true);
    updateUI();

</script>
